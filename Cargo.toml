[package]
name = "signal-energy-nexus"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-flow/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "4871bb81c1119fe72dc76168a97e1e576411b831", default-features = false }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "5a5daca", default-features = false }
